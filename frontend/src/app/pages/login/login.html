<mat-card style="max-width:400px;margin:40px auto;padding:8px">
  <mat-card-title>Entrar</mat-card-title>
  <mat-card-content style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="email" type="email" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Senha</mat-label>
      <input matInput [(ngModel)]="password" type="password" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="entrar()">Entrar</button>
    @if (erro) { <mat-error>{{ erro }}</mat-error> }
  </mat-card-content>
</mat-card>
